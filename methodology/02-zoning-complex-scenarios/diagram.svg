<svg viewBox="0 0 780 380" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
  <style>
    text { fill: #1a1a1a; }
    .label { font-size: 13px; font-weight: 500; }
    .small { font-size: 11px; fill: #6b7280; }
    .title { font-size: 15px; font-weight: 700; }
    .q { font-size: 12px; font-weight: 500; }
  </style>

  <text x="390" y="30" text-anchor="middle" class="title">复杂场景判区决策树</text>

  <!-- Start -->
  <rect x="290" y="50" width="200" height="32" rx="4" fill="#1a1a1a"/>
  <text x="390" y="72" text-anchor="middle" fill="#fafaf7" class="label">拿到一个场景</text>

  <!-- Arrow down -->
  <line x1="390" y1="82" x2="390" y2="110" stroke="#1a1a1a" stroke-width="1.5"/>
  <polygon points="386,106 394,106 390,114" fill="#1a1a1a"/>

  <!-- Q1 -->
  <rect x="240" y="114" width="300" height="32" rx="4" fill="#e5e7eb"/>
  <text x="390" y="136" text-anchor="middle" class="q">存在明确、稳定的完成路径？</text>

  <!-- Yes branch -->
  <line x1="390" y1="146" x2="390" y2="170" stroke="#1a1a1a" stroke-width="1"/>
  <text x="398" y="163" class="small">是</text>

  <rect x="240" y="170" width="300" height="32" rx="4" fill="#e5e7eb"/>
  <text x="390" y="192" text-anchor="middle" class="q">产品承诺在此稳定完整交付？</text>

  <line x1="390" y1="202" x2="390" y2="230" stroke="#1a1a1a" stroke-width="1"/>
  <text x="398" y="220" class="small">是</text>

  <rect x="310" y="230" width="160" height="32" rx="4" fill="#1a1a1a"/>
  <text x="390" y="252" text-anchor="middle" fill="#fafaf7" class="label">→ 核心区</text>

  <!-- Q1 No branch -->
  <line x1="540" y1="130" x2="660" y2="130" stroke="#1a1a1a" stroke-width="1"/>
  <text x="555" y="125" class="small">否</text>
  <line x1="660" y1="130" x2="660" y2="170" stroke="#1a1a1a" stroke-width="1"/>
  <polygon points="656,166 664,166 660,174" fill="#1a1a1a"/>

  <rect x="560" y="174" width="200" height="32" rx="4" fill="#e5e7eb"/>
  <text x="660" y="196" text-anchor="middle" class="q">与产品业务相关？</text>

  <line x1="660" y1="206" x2="660" y2="234" stroke="#1a1a1a" stroke-width="1"/>
  <text x="668" y="224" class="small">是</text>

  <rect x="580" y="234" width="160" height="32" rx="4" fill="#e5e7eb"/>
  <text x="660" y="256" text-anchor="middle" class="label">→ 边缘区</text>

  <line x1="660" y1="266" x2="660" y2="286" stroke="#6b7280" stroke-width="1"/>
  <text x="660" y="302" text-anchor="middle" class="small">受信息/知识/系统限制</text>
  <text x="660" y="318" text-anchor="middle" class="small">无稳定完成路径</text>

  <!-- Q2 No branch -->
  <line x1="760" y1="190" x2="760" y2="234" stroke="#6b7280" stroke-width="1"/>
  <text x="763" y="218" class="small">否</text>

  <rect x="680" y="234" width="100" height="32" rx="0" fill="none" stroke="#6b7280"/>
  <!-- This overlaps, let me adjust -->

  <!-- Actually let me use a simpler layout for the "no" to interface -->
  <line x1="560" y1="190" x2="500" y2="190" stroke="#6b7280" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Q2 No → 界外 -->
  <text x="768" y="224" class="small">否</text>

  <!-- Bottom: route note -->
  <rect x="40" y="280" width="440" height="56" rx="4" fill="none" stroke="#e5e7eb" stroke-width="1"/>
  <text x="260" y="300" text-anchor="middle" class="small">路由不构成独立场景：路由以动作 / 归因 / trace 切面三种身份存在</text>
  <text x="260" y="318" text-anchor="middle" class="small">多轮切换、多意图 → 真实场景在复杂条件下的变体</text>

  <!-- 界外区 box -->
  <rect x="620" y="346" width="120" height="28" rx="4" fill="none" stroke="#6b7280"/>
  <text x="680" y="366" text-anchor="middle" class="label" fill="#6b7280">→ 界外区</text>
  <line x1="760" y1="206" x2="760" y2="360" stroke="#6b7280" stroke-width="1"/>
  <line x1="760" y1="360" x2="740" y2="360" stroke="#6b7280" stroke-width="1"/>
</svg>
