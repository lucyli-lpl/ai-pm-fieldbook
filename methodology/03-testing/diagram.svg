<svg viewBox="0 0 780 400" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono', monospace">
  <style>
    text { fill: #1a1a1a; }
    .label { font-size: 13px; font-weight: 500; }
    .small { font-size: 11px; fill: #6b7280; }
    .title { font-size: 15px; font-weight: 700; }
    .layer { font-size: 12px; font-weight: 500; }
  </style>

  <text x="390" y="30" text-anchor="middle" class="title">验收四层结构</text>

  <!-- Layer 4 -->
  <rect x="60" y="50" width="660" height="60" rx="4" fill="none" stroke="#1a1a1a" stroke-width="2"/>
  <text x="80" y="72" class="layer">第4层</text>
  <text x="80" y="92" class="small">决策 (PM)</text>
  <text x="200" y="82" class="label">阻断发布？达标？先修谁？</text>
  <text x="460" y="82" class="small">← 应然线 × 实然值</text>

  <!-- Arrow -->
  <line x1="390" y1="110" x2="390" y2="130" stroke="#6b7280" stroke-width="1"/>
  <polygon points="386,126 394,126 390,132" fill="#6b7280"/>

  <!-- Layer 3 -->
  <rect x="60" y="132" width="660" height="70" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1.5"/>
  <text x="80" y="155" class="layer">第3层</text>
  <text x="80" y="175" class="small">应然+实然</text>
  <text x="200" y="158" class="label">应然：S0 / S1 / S2 → 通过率要求线</text>
  <text x="200" y="180" class="label">实然：准确率 / 召回 / 通过率</text>
  <text x="580" y="168" class="small">← 聚合</text>

  <!-- Arrow -->
  <line x1="390" y1="202" x2="390" y2="222" stroke="#6b7280" stroke-width="1"/>
  <polygon points="386,218 394,218 390,224" fill="#6b7280"/>

  <!-- Layer 2 -->
  <rect x="60" y="224" width="660" height="60" rx="4" fill="none" stroke="#1a1a1a" stroke-width="1"/>
  <text x="80" y="248" class="layer">第2层</text>
  <text x="80" y="268" class="small">判定 (QA)</text>
  <text x="200" y="258" class="label">L1 断言 过/不过 · L2 人工 好/坏</text>
  <text x="580" y="258" class="small">← 执行</text>

  <!-- Arrow -->
  <line x1="390" y1="284" x2="390" y2="304" stroke="#6b7280" stroke-width="1"/>
  <polygon points="386,300 394,300 390,306" fill="#6b7280"/>

  <!-- Layer 1 -->
  <rect x="60" y="306" width="660" height="60" rx="4" fill="#e5e7eb" stroke="#1a1a1a" stroke-width="1"/>
  <text x="80" y="330" class="layer">第1层</text>
  <text x="80" y="350" class="small">期望 (PM)</text>
  <text x="200" y="340" class="label">每个场景该有什么行为 ← 能力边界方法论</text>

  <!-- Right side: three axes -->
  <text x="390" y="393" text-anchor="middle" class="small">三轴交叉：期望行为(三区) × 严重度(S0/S1/S2) × 测试手段(L1/L2/L3)</text>
</svg>
