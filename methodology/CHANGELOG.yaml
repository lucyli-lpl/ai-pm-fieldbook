- version: "2.0"
  date: 2026-09
  summary: Anthropic Prompt Engineering 精读落地 + 里程碑收尾
  modules: [1, 5, 6]
  trigger: reading
  trigger_ref: Anthropic Prompt Engineering 官方文档精读
  details: |
    5.3 生成把关：框架标准先于测试题、prompt 非万能药（归因到"哪一段 prompt"）、提示词技术阶梯、system prompt 五层 + 8 条把关清单、详略分寸。
    5.4 架构选择：CoT vs workflow vs agent 的两刀判断、企业场景自主性能少则少。
    新增第六章「AI 产品观」：AI 产品是一连串 tradeoff、核心工作是把模糊能力规定成清晰承诺、能力边界母表要尽早。

- version: "1.9"
  date:
  summary: 追问部分新增两种澄清方式（结构化澄清 vs 推理式澄清）
  modules: [1]
  trigger: internal  # TODO 确认：推理式澄清是否由真实场景触发？
  details: |
    当不确定性来自"语义多义"而非"具体字段缺失"时，须用推理式澄清（AI 临场生成分支，无需预定义字段）。纠正技术常见误区"语义多义无法追问"。

- version: "1.8"
  date:
  summary: 重组 Ch5，从"落地三视角"改为"测试 + 数据运营"双阶段（ADLC）
  modules: [3, 4]
  trigger: internal
  details: |
    明确 L1/L2/L3 是测试手段，不是数据运营工具；测试与运营按"时机/数据/目的/核心能力"四线区分。
    5.2 数据运营独立成"数据流"大节（十子节）：五步闭环+起点前置、先窄起步、三源分工、点踩设计原则、后台打标+分类器版本化、行为信号、信号价值分级、error analysis 引擎、归因派单、隐私治理。

